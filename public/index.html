
<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>みんなのお絵かき選手権</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;overflow-x:hidden;overflow-y:auto}
body{font-family:system-ui,sans-serif;background:#fff8ef;color:#302b38;padding:12px 12px 260px}
header{position:sticky;top:0;background:#fff8efee;z-index:4;padding:8px 0;border-bottom:2px solid #f2d6c4}
h1{font-size:21px;margin:4px 0}
h2{font-size:17px;margin:8px 0}
main{max-width:850px;margin:auto}
section{background:white;border-radius:14px;padding:12px;margin:12px 0;box-shadow:0 2px 10px #0001}
input,select,button{font:inherit;max-width:100%;padding:9px;border:1px solid #d6c8cb;border-radius:9px}
input{width:100%;margin:4px 0}
button{background:#ffdd9c;cursor:pointer;font-weight:600}
button:disabled{opacity:.5}
button.primary{background:#ff9d72}
button.small{padding:5px 8px;font-size:13px}
.line{display:flex;gap:7px;align-items:center;flex-wrap:wrap;margin:7px 0}
.line>*{flex-shrink:0}
.muted{color:#776c79;font-size:12px}
.hide{display:none!important}
#timer{font-size:23px;font-weight:800;color:#c94d57}
.canvasWrap{padding:0 26px}
canvas{width:100%;display:block;background:#fff;border:2px solid #d5bfc8;border-radius:9px;touch-action:pan-y}
.tools{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tools input[type=color]{width:50px;height:42px;padding:2px}
.tools input[type=range]{width:110px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{border:1px solid #e7d6da;border-radius:12px;overflow:hidden;background:#fff;cursor:pointer;min-width:0}
.tile canvas{border:0;border-radius:0;pointer-events:none;aspect-ratio:4/3}
.tile .name{font-size:12px;text-align:center;padding:6px;overflow-wrap:anywhere}
.tile .status{font-size:10px;color:#8b7a85}
.chat{position:fixed;bottom:10px;right:10px;left:10px;max-width:850px;margin:auto;background:#fffefaed;border:1px solid #e8d4ca;border-radius:12px;padding:8px;z-index:5;box-shadow:0 3px 12px #0002}
.messages{max-height:90px;overflow-y:auto;font-size:13px;overflow-wrap:anywhere}
.chat .line{margin:4px 0}
.chat input{flex:1;min-width:0;width:1px}
#modal{position:fixed;inset:0;background:#000b;z-index:10;display:flex;align-items:center;justify-content:center;padding:15px}
#modal .inner{background:white;width:min(95vw,900px);max-height:95vh;overflow:auto;border-radius:14px;padding:12px}
#bigCanvas{width:100%;touch-action:pan-y}
.hand{border-bottom:1px solid #eee;padding:6px 0}
@media(min-width:650px){.gallery{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:380px){.canvasWrap{padding:0 18px}}
</style>
</head>
<body>
<main>
<header>
<h1>🎨 みんなのお絵かき選手権！</h1>
<div id="summary" class="muted">部屋に入ってね</div>
</header>
<section id="entry">
<h2>入室</h2>
<input id="nickname" placeholder="ニックネーム" maxlength="24">
<input id="room" placeholder="部屋番号（例：yuki1234）" maxlength="32">
<div class="line">
<select id="role">
<option value="drawer">✏️ 描き手（最大20人）</option>
<option value="viewer">👀 視聴者</option>
</select>
<button class="primary" id="join">参加する</button>
</div>
<button id="copyLink">🔗 URLコピー</button>
<p class="muted">同じ部屋番号で参加。最初に入室した人が主催者です。</p>
</section>
<section id="lobby" class="hide">
<h2>🙋 お題を決めよう</h2>
<p id="hostLabel"></p>
<button id="raise">🙋 挙手する</button>
<div id="hands"></div>
<div id="proposeArea" class="hide">
<input id="proposal" maxlength="80" placeholder="お題を入力">
<button id="sendProposal">お題を提出</button>
</div>
<div id="hostControls" class="hide">
<p id="proposed"></p>
<button id="approve">このお題で決定</button>
<div class="line">
<label>制限時間
<select id="duration">
<option value="60">1分</option>
<option value="120">2分</option>
<option value="180">3分</option>
<option value="240">4分</option>
<option value="300" selected>5分</option>
</select>
</label>
<button class="primary" id="start">🎨 全員スタート！</button>
</div>
</div>
<p id="chosen"></p>
</section>
<section id="round" class="hide">
<div class="line">
<strong id="topic"></strong>
<span id="timer">05:00</span>
</div>
<p id="phaseLabel" class="muted"></p>
<div id="drawingArea" class="hide">
<h2>✏️ あなたのスケッチ</h2>
<div class="tools">
<input type="color" id="color" value="#242424" aria-label="ペンの色">
<label>太さ <input type="range" id="size" min="1" max="30" value="4"></label>
<button id="eraser">消しゴム</button>
</div>
<div class="canvasWrap">
<canvas id="drawCanvas" width="800" height="600"></canvas>
</div>
<p class="muted">描画中は左右の余白をスワイプするとスクロールできます。</p>
<button class="primary" id="finish">✅ 完成！全員の絵を見る</button>
</div>
<div id="galleryArea" class="hide">
<h2>🖼️ みんなの作品 <span id="count"></span></h2>
<p class="muted">描いている途中の線も更新されます。タップで個別拡大できます。</p>
<div id="gallery" class="gallery"></div>
</div>
<div id="endControls" class="hide line">
<button id="end">⏹ 終了</button>
<button id="reset">🔄 次のお題へ</button>
</div>
</section>
<section id="participants" class="hide">
<h2>👥 参加者</h2>
<div id="memberList" class="muted"></div>
</section>
</main>
<div id="chatBox" class="chat hide">
<div id="messages" class="messages"></div>
<div class="line">
<input id="chatInput" maxlength="300" placeholder="コメントを入力">
<button id="sendChat">送信</button>
</div>
</div>
<div id="modal" class="hide">
<div class="inner">
<div class="line">
<strong id="bigName"></strong>
<button id="closeModal">閉じる ✕</button>
</div>
<canvas id="bigCanvas" width="800" height="600"></canvas>
</div>
</div>
<script>
const $=id=>document.getElementById(id);
let ws,myId=null,game=null,strokes={},active=false,last=null,penColor='#242424',expanded=null;
const params=new URLSearchParams(location.search);
if(params.get('room'))$('room').value=params.get('room');
function emit(type,extra={}){
 if(ws&&ws.readyState===1)ws.send(JSON.stringify({type,...extra}));
}
function show(id,yes){$(id).classList.toggle('hide',!yes);}
function notice(message){alert(message);}
function myMember(){return game?.members.find(m=>m.id===myId);}
function isHost(){return !!game&&game.hostId===myId;}
function drawStroke(ctx,s){
 const pts=s.points;
 if(!pts?.length)return;
 ctx.strokeStyle=s.color;
 ctx.fillStyle=s.color;
 ctx.lineWidth=s.size;
 ctx.lineCap='round';
 ctx.lineJoin='round';
 ctx.beginPath();
 ctx.moveTo(pts[0].x*800,pts[0].y*600);
 if(pts.length===1){
  ctx.arc(pts[0].x*800,pts[0].y*600,s.size/2,0,Math.PI*2);
  ctx.fill();
  return;
 }
 for(const p of pts.slice(1))ctx.lineTo(p.x*800,p.y*600);
 ctx.stroke();
}
function renderCanvas(canvas,id){
 const ctx=canvas.getContext('2d');
 ctx.clearRect(0,0,800,600);
 ctx.fillStyle='#fff';
 ctx.fillRect(0,0,800,600);
 for(const s of strokes[id]||[])drawStroke(ctx,s);
}
function renderAll(){
 if(!game)return;
 const ids=game.members.filter(m=>m.role==='drawer').map(m=>m.id);
 const gallery=$('gallery');
 const current=[...gallery.children].map(el=>el.dataset.id);
 if(current.join('|')!==ids.join('|')){
  gallery.replaceChildren();
  for(const id of ids){
   const m=game.members.find(x=>x.id===id);
   const tile=document.createElement('div');
   tile.className='tile';
   tile.dataset.id=id;
   const c=document.createElement('canvas');
   c.width=800;c.height=600;
   const name=document.createElement('div');
   name.className='name';
   name.textContent=m.name;
   const status=document.createElement('div');
   status.className='status';
   status.textContent=m.finished?'✅ 完成':'✏️ 描画中';
   name.appendChild(status);
   tile.append(c,name);
   tile.onclick=()=>openBig(id);
   gallery.appendChild(tile);
  }
 }
 for(const tile of gallery.children){
  const m=game.members.find(x=>x.id===tile.dataset.id);
  if(m){
   tile.querySelector('.name').firstChild.textContent=m.name;
   tile.querySelector('.status').textContent=m.finished?'✅ 完成':'✏️ 描画中';
   renderCanvas(tile.querySelector('canvas'),m.id);
  }
 }
 $('count').textContent='('+ids.length+'/20)';
 if(expanded)renderCanvas($('bigCanvas'),expanded);
}
function openBig(id){
 expanded=id;
 const m=game.members.find(x=>x.id===id);
 $('bigName').textContent=m?.name||'作品';
 renderCanvas($('bigCanvas'),id);
 show('modal',true);
}
$('closeModal').onclick=()=>{
 expanded=null;
 show('modal',false);
};
function updateClock(){
 if(!game)return;
 const seconds=game.phase==='draw'
  ?Math.max(0,Math.ceil((game.endsAt-Date.now())/1000))
  :game.duration||300;
 $('timer').textContent=String(Math.floor(seconds/60)).padStart(2,'0')
  +':'+String(seconds%60).padStart(2,'0');
}
function refresh(){
 if(!game)return;
 const me=myMember(),host=isHost();
 const drawing=game.phase==='draw'&&me?.role==='drawer'&&!me.finished;
 const canSee=game.phase==='gallery'||me?.role==='viewer'
  ||(me?.role==='drawer'&&me.finished);
 $('summary').textContent='部屋：'+$('room').value+' ／ '
  +(game.phase==='lobby'?'お題決め':game.phase==='draw'?'お絵かき中':'鑑賞会');
 show('entry',false);
 show('lobby',game.phase==='lobby');
 show('round',game.phase!=='lobby');
 show('participants',true);
 show('chatBox',true);
 $('hostLabel').textContent='主催者：'
  +(game.members.find(m=>m.id===game.hostId)?.name||'');
 $('raise').textContent=me?.raised?'🙋 挙手を取り消す':'🙋 挙手する';
 show('proposeArea',game.phase==='lobby'&&game.nominatedId===myId);
 show('hostControls',host&&game.phase==='lobby');
 $('proposed').textContent=game.proposedTopic
  ?'提案されたお題：'+game.proposedTopic
  :'指名した人のお題を待っています';
 $('chosen').textContent=game.topic?'決定したお題：'+game.topic:'';
 $('topic').textContent='お題：'+game.topic;
 $('phaseLabel').textContent=game.phase==='gallery'
  ?'全員の絵を鑑賞しよう！'
  :drawing?'描き終わったら「完成」を押してね'
  :'みんなのお絵かきを見守ろう！';
 show('drawingArea',drawing);
 show('galleryArea',canSee);
 show('endControls',host&&game.phase!=='lobby');
 $('drawCanvas').style.touchAction=drawing?'none':'pan-y';
 $('memberList').textContent=game.members.map(m=>
  (m.host?'👑 ':'')+m.name
  +(m.role==='drawer'?' ✏️':' 👀')
  +(m.finished?' ✅':'')
 ).join(' ／ ');
 const hands=$('hands');
 hands.replaceChildren();
 for(const m of game.members.filter(m=>m.raised)){
  const row=document.createElement('div');
  row.className='hand';
  row.textContent='🙋 '+m.name+' ';
  if(host){
   const b=document.createElement('button');
   b.className='small';
   b.textContent='指名';
   b.onclick=()=>emit('nominate',{id:m.id});
   row.append(b);
  }
  hands.append(row);
 }
 renderCanvas($('drawCanvas'),myId);
 renderAll();
 updateClock();
}
$('join').onclick=()=>{
 const name=$('nickname').value.trim(),room=$('room').value.trim();
 if(!name||!/^[a-zA-Z0-9_-]{1,32}$/.test(room))
  return notice('名前と部屋番号（英数字・_-）を入力してね');
 ws=new WebSocket((location.protocol==='https:'?'wss://':'ws://')+location.host);
 $('join').disabled=true;
 ws.onopen=()=>emit('join',{name,room,role:$('role').value});
 ws.onmessage=e=>{
  let msg;
  try{msg=JSON.parse(e.data)}catch{return;}
  if(msg.type==='error'){
   notice(msg.message);
   $('join').disabled=false;
  }
  if(msg.type==='joined'){
   myId=msg.id;
   history.replaceState(null,'','?room='+encodeURIComponent(room));
  }
  if(msg.type==='state'){
   game=msg;
   strokes=msg.drawings||{};
   refresh();
  }
  if(msg.type==='stroke'){
   (strokes[msg.id]??=[]).push(msg.stroke);
   if(msg.id===myId)renderCanvas($('drawCanvas'),myId);
   if(!$('galleryArea').classList.contains('hide'))renderAll();
  }
  if(msg.type==='chat'){
   const d=document.createElement('div');
   d.textContent=msg.name+'：'+msg.text;
   $('messages').append(d);
   while($('messages').children.length>100)
    $('messages').firstChild.remove();
   $('messages').scrollTop=$('messages').scrollHeight;
  }
 };
 ws.onclose=()=>{
  $('join').disabled=false;
  notice('接続が切れました。ページを再読み込みしてね');
 };
};
$('copyLink').onclick=async()=>{
 const room=$('room').value.trim();
 const url=location.origin+location.pathname
  +(room?'?room='+encodeURIComponent(room):'');
 try{
  await navigator.clipboard.writeText(url);
  notice('URLをコピーしたよ！');
 }catch{
  prompt('URLをコピーしてね',url);
 }
};
$('raise').onclick=()=>emit('raise',{raised:!myMember()?.raised});
$('sendProposal').onclick=()=>emit('propose',{topic:$('proposal').value});
$('approve').onclick=()=>emit('approve');
$('start').onclick=()=>emit('start',{seconds:Number($('duration').value)});
$('finish').onclick=()=>emit('finish');
$('end').onclick=()=>{
 if(confirm('お絵かきを終了しますか？'))emit('end');
};
$('reset').onclick=()=>{
 if(confirm('次のお題に進みますか？全員の絵は消えます。'))emit('reset');
};
$('sendChat').onclick=()=>{
 const text=$('chatInput').value.trim();
 if(text){
  emit('chat',{text});
  $('chatInput').value='';
 }
};
$('chatInput').addEventListener('keydown',e=>{
 if(e.key==='Enter')$('sendChat').click();
});
$('color').oninput=e=>penColor=e.target.value;
$('eraser').onclick=()=>{
 penColor='#ffffff';
 $('color').value='#ffffff';
};
const canvas=$('drawCanvas');
function pos(e){
 const r=canvas.getBoundingClientRect();
 return{
  x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),
  y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))
 };
}
function drawAllowed(){
 return game?.phase==='draw'
  &&myMember()?.role==='drawer'
  &&!myMember()?.finished;
}
function segment(a,b){
 const s={
  points:[a,b],
  color:penColor,
  size:Number($('size').value)
 };
 (strokes[myId]??=[]).push(s);
 renderCanvas(canvas,myId);
 emit('stroke',{stroke:s});
}
canvas.addEventListener('pointerdown',e=>{
 if(!drawAllowed())return;
 active=true;
 last=pos(e);
 canvas.setPointerCapture(e.pointerId);
 segment(last,last);
});
canvas.addEventListener('pointermove',e=>{
 if(!active||!drawAllowed())return;
 const p=pos(e);
 if(Math.hypot(p.x-last.x,p.y-last.y)<.002)return;
 segment(last,p);
 last=p;
});
function stop(){active=false;last=null;}
canvas.addEventListener('pointerup',stop);
canvas.addEventListener('pointercancel',stop);
setInterval(updateClock,250);
</script>
</body>
</html>
